<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planogram — Sign in</title>
    <link rel="icon" href="/static/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f172a;
        --bg-elev: #1e293b;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #10b981;
        --accent-hover: #059669;
        --border: #334155;
        --danger: #f43f5e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(ellipse 80% 60% at 20% 10%, rgba(16, 185, 129, 0.18), transparent),
          radial-gradient(ellipse 60% 50% at 90% 80%, rgba(14, 165, 233, 0.12), transparent),
          linear-gradient(160deg, #0f172a 0%, #1e293b 55%, #0f172a 100%);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(400px, 100%);
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 36px 32px;
        backdrop-filter: blur(12px);
        box-shadow: 0 16px 48px rgba(15, 23, 42, 0.45);
      }
      .brand {
        font-family: Sora, sans-serif;
        font-weight: 700;
        font-size: 1.75rem;
        letter-spacing: -0.02em;
        margin: 0 0 4px;
      }
      .brand span { color: var(--accent); }
      .sub {
        color: var(--muted);
        margin: 0 0 28px;
        font-size: 0.95rem;
      }
      label {
        display: block;
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #0f172a;
        color: var(--text);
        font: inherit;
        margin-bottom: 16px;
      }
      input:focus {
        outline: 2px solid rgba(16, 185, 129, 0.45);
        border-color: var(--accent);
      }
      button {
        width: 100%;
        margin-top: 8px;
        padding: 12px 16px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #042f2e;
        font-family: Sora, sans-serif;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
      }
      button:hover { background: var(--accent-hover); color: #fff; }
      .err {
        color: var(--danger);
        font-size: 0.85rem;
        min-height: 1.2em;
        margin-bottom: 8px;
      }
      .hint {
        margin-top: 20px;
        font-size: 0.75rem;
        color: var(--muted);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 class="brand">Plano<span>gram</span></h1>
      <p class="sub">Sign in to continue to your stores.</p>
      <div class="err" id="err"></div>
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required value="designer" />
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          value="designer123"
        />
        <button type="submit">Sign in</button>
      </form>
      <p class="hint">Demo: designer / designer123 · steward / steward123 · viewer / viewer123</p>
    </div>
    <script>
      function getCookie(name) {
        const m = document.cookie.match(new RegExp("(^| )" + name + "=([^;]+)"));
        return m ? decodeURIComponent(m[2]) : null;
      }
      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const err = document.getElementById("err");
        err.textContent = "";
        await fetch("/accounts/csrf/", { credentials: "same-origin" });
        const csrf = getCookie("csrftoken");
        const body = {
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        };
        const res = await fetch("/accounts/login/", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrf || "",
          },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          err.textContent = data.detail || "Sign-in failed";
          return;
        }
        window.location.href = "/";
      });
    </script>
  </body>
</html>
