<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planogram</title>
    <link rel="icon" href="/static/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    {% if debug %}
    <script type="module">
      // Dev: Vite SPA on uncommon port
      import RefreshRuntime from "http://127.0.0.1:4521/@react-refresh";
      RefreshRuntime.injectIntoGlobalHook(window);
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
    <script type="module" src="http://127.0.0.1:4521/@vite/client"></script>
    <script type="module" src="http://127.0.0.1:4521/src/main.tsx"></script>
    {% else %}
    <link rel="stylesheet" href="/static/spa/assets/index.css" />
    <script type="module" src="/static/spa/assets/index.js"></script>
    {% endif %}
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
